name: Pinshot
options:
  bundleIdPrefix: app.nexy
  developmentLanguage: ja
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
# ビルドの設定は 3 つ。Install は make install 用で、配る版と同じ最適化（release）のまま、開発のビルドとして入れる
configs:
  Debug: debug
  Release: release
  Install: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  Pinshot:
    type: application
    platform: macOS
    sources:
      - path: Pinshot
    dependencies:
      # 更新の仕組み（Sparkle）。make が Vendor/Sparkle に取り寄せたものを、アプリに入れる
      - framework: Vendor/Sparkle/Sparkle.framework
        embed: true
    info:
      path: Pinshot/Info.plist
      properties:
        # 画面に出る名前。配る版は Pinshot、開発のビルドは Pinshot Dev（下の settings の PINSHOT_DISPLAY_NAME で分ける）
        CFBundleDisplayName: $(PINSHOT_DISPLAY_NAME)
        # 日本語のアプリだと宣言する（しないと、文字の欄の右クリックなど、macOS の部品が英語で出る）
        CFBundleDevelopmentRegion: ja
        CFBundleLocalizations:
          - ja
        # アプリの版（make dist・make publish もここから読む）。出すたびに上げる。
        # CFBundleVersion（ビルド番号）も 1 つずつ上げる（Sparkle は、ビルド番号で新旧を比べる）
        CFBundleShortVersionString: "0.2.1"
        CFBundleVersion: "5"
        # β 版か（設定の「バージョン」に「（β 版）」と出す。正式版にするときに false にする）
        PinshotIsBeta: true
        # Dock に出さず、メニューバーだけに常駐する
        LSUIElement: true
        # 録画にマイクの音を入れるときに、macOS の確かめるダイアログに出す説明
        NSMicrophoneUsageDescription: 録画にマイクの音（あなたの声など）を入れるときに使います。マイクの音は録画のファイルにだけ書き、ほかには送りません。
        LSMinimumSystemVersion: "14.0"
        # データ（履歴・浮かせた画像・録画）を置くフォルダの名前（~/Library/Application Support/<名前>）。
        # 開発のビルドは Pinshot Dev にして、配る版のデータに触れない（下の settings の PINSHOT_DATA_FOLDER_NAME で分ける）
        PinshotDataFolderName: $(PINSHOT_DATA_FOLDER_NAME)
        # 更新（Sparkle）。版の一覧（appcast.xml）の場所。組織 nexy-apps の GitHub Pages に置く（配ったあとは変えない）
        SUFeedURL: https://nexy-apps.github.io/pinshot/appcast.xml
        # 更新ファイルの署名を確かめる公開鍵（下の settings の PINSHOT_UPDATE_PUBLIC_KEY。空のビルドでは、更新の機能を出さない）
        SUPublicEDKey: $(PINSHOT_UPDATE_PUBLIC_KEY)
        # 新しい版を自動で確かめる（1 時間に 1 回。Sparkle が受け付けるいちばん短い間隔。VS Code と同じ間隔。設定の「一般」で切れる）
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 3600
    entitlements:
      path: Pinshot/Pinshot.entitlements
      properties:
        # Team ID のない署名（自己署名の証明書・アドホック署名）では、Hardened Runtime のままだと、
        # アプリに入れた Sparkle の読み込みを断られるので、ライブラリの検証を切る（Pinshelf・Pinstage と同じ）
        com.apple.security.cs.disable-library-validation: true
        # Hardened Runtime では、マイクを使うのにこの権限が要る（録画にマイクの音を入れるため。ないと音が録れない）
        com.apple.security.device.audio-input: true
    settings:
      base:
        # アプリの ID。配る版は app.nexy.Pinshot、開発のビルドは後ろに .dev を付ける（決まりは共通のノート「Pinシリーズの決まり」）
        PRODUCT_BUNDLE_IDENTIFIER: app.nexy.Pinshot
        PINSHOT_DISPLAY_NAME: Pinshot
        PINSHOT_DATA_FOLDER_NAME: Pinshot
        # 更新ファイルの署名を確かめる公開鍵（秘密鍵は、作者の金庫の中。アカウント名 nexy-release。Pin シリーズで共通）
        PINSHOT_UPDATE_PUBLIC_KEY: "btZMA9m6IhHTFewQG183f6jcLXfvO+GlDfEzWSmZZ28="
        # アプリのアイコン（scripts/make-app-icon.swift で描いて書き出す）
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 署名は、自分で作った証明書で行う（Apple の Developer ID は使わない）。証明書は下の configs で分ける
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        # 動いているアプリへの割り込み・部品の差し込みを断る（Pin シリーズの配る版はすべてオン。公証にも要る）
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
      configs:
        # 開発のビルド（make build・make run）: 別の ID・別の名前・別のデータのフォルダ・開発用の証明書。
        # 更新の機能は出さない（公開鍵を空にする。配る版を「新しい版」と見て入れ替えないように）。
        # Debug ではアプリのコードを Pinshot.debug.dylib に分けて読み込むので、
        # 自前の証明書で署名しても読み込みを断られないよう、Debug だけ Hardened Runtime を切る（Pinshelf・Pinstage と同じ）
        Debug:
          <<: &dev
            PRODUCT_BUNDLE_IDENTIFIER: app.nexy.Pinshot.dev
            PINSHOT_DISPLAY_NAME: Pinshot Dev
            PINSHOT_DATA_FOLDER_NAME: Pinshot Dev
            PINSHOT_UPDATE_PUBLIC_KEY: ""
            CODE_SIGN_IDENTITY: nexy Dev Signing
          ENABLE_HARDENED_RUNTIME: NO
        # make install: 配る版と同じ作り（最適化・Hardened Runtime・get-task-allow なし）で、ID・名前・データのフォルダ・証明書は開発のビルドと同じ
        Install:
          <<: *dev
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        # 配る版: 配る版用の証明書（nexy Release Signing。作者の金庫の中）。名前は誰でも同じものを作れるので、SHA-1 で選ぶ
        # （make dist もここから読む）。make dist が金庫を開けてから使う。Xcode から直接ビルドすると、
        # 金庫が検索リストにないので「No certificate matching …」で止まる（アドホック署名にはならない）。
        # デバッガをつなぐための許可（get-task-allow）を入れない（何もしないと、Xcode がビルドのときに足す）
        Release:
          CODE_SIGN_IDENTITY: F84FBC463E4889FC6FED2DEF2DC27A9310DB57FC
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    scheme:
      testTargets:
        - PinshotTests

  # 画面に関係ない処理（書き込みのデータ・保存する形・書き出し・録画やアップロードの決まりなど）のテスト。
  # アプリを起動せずに動かせるよう、使うソースをテストに直接入れる
  PinshotTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PinshotTests
      - path: Pinshot/Editor/RGBAColor.swift
      - path: Pinshot/Editor/Tool.swift
      - path: Pinshot/Editor/ToolGroup.swift
      - path: Pinshot/Editor/AnnotationStyles.swift
      - path: Pinshot/Editor/Annotation.swift
      - path: Pinshot/Editor/EditorStyle.swift
      - path: Pinshot/Editor/EditHistory.swift
      - path: Pinshot/Editor/AnnotationDocument.swift
      - path: Pinshot/Editor/EditHandle.swift
      - path: Pinshot/Editor/AnnotationRenderer.swift
      - path: Pinshot/Editor/ImageEffects.swift
      - path: Pinshot/Editor/ImageExporter.swift
      - path: Pinshot/Pin/ResizeEdges.swift
      - path: Pinshot/Settings/ExportDecoration.swift
      - path: Pinshot/Settings/Shortcut.swift
      - path: Pinshot/Screenshot/CaptureTypes.swift
      - path: Pinshot/Support/GraphicsHelpers.swift
      - path: Pinshot/Support/ScreenGeometry.swift
      - path: Pinshot/Support/PercentText.swift
      - path: Pinshot/Editor/TextRecognizer.swift
      - path: Pinshot/Editor/TextMarkLayout.swift
      - path: Pinshot/Recording/RecordingRules.swift
      - path: Pinshot/Recording/GIFExporter.swift
      - path: Pinshot/Recording/AudioMixdown.swift
      - path: Pinshot/Support/SaveLocation.swift
      - path: Pinshot/Support/StoredJSON.swift
      - path: Pinshot/History/CaptureHistoryEntry.swift
      - path: Pinshot/History/TextHistoryEntry.swift
      - path: Pinshot/History/ListSelection.swift
      - path: Pinshot/Support/KeyCode.swift
      - path: Pinshot/Pin/SavedPin.swift
      - path: Pinshot/Upload/UploadTypes.swift
      - path: Pinshot/Upload/UploadRules.swift
      - path: Pinshot/Upload/UploadHistoryEntry.swift
      - path: Pinshot/Upload/OAuth/PKCE.swift
      - path: Pinshot/Upload/OAuth/OAuthConfiguration.swift
      - path: Pinshot/App/AppUpdates.swift
      - path: Pinshot/App/AppInfo.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.nexy.Pinshot.tests
        # テストも開発用の証明書で署名する（make test は ADHOC=1 のときだけアドホック署名にする）
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: nexy Dev Signing
        DEVELOPMENT_TEAM: ""
